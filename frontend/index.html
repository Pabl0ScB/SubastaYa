<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — SubastaYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/sesion.js"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SubastaYa</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal"
                    aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Catálogo</a></li>
                    <li class="nav-item" data-sesion="privado" hidden><a class="nav-link" href="publicar.html">Publicar</a></li>
                    <li class="nav-item" data-sesion="privado" hidden><a class="nav-link" href="billetera.html">Billetera</a></li>
                    <li class="nav-item" data-sesion="privado" hidden><a class="nav-link" href="mis-actividades.html">Mis actividades</a></li>
                </ul>
                <ul class="navbar-nav align-items-lg-center gap-lg-2">
                    <li class="nav-item" data-sesion="anonimo"><a class="nav-link" href="login.html">Ingresar</a></li>
                    <li class="nav-item" data-sesion="anonimo"><a class="nav-link" href="registro.html">Crear cuenta</a></li>
                    <li class="nav-item" data-sesion="privado" hidden><span class="navbar-text" id="usuario-actual"></span></li>
                    <li class="nav-item" data-sesion="privado" hidden><button class="btn btn-sm btn-outline-light" type="button" id="boton-cerrar-sesion">Cerrar sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h3 mb-4">Catálogo</h1>
    

        <div id="alerta-catalogo" class="alert" role="alert" hidden></div>

        <!-- Cargando -->
        <div id="cargando-catalogo" class="text-center py-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando…</span>
            </div>
        </div>

        <!-- Vacío -->
        <div id="vacio-catalogo" class="text-center py-5 text-muted" hidden>
            <p class="mb-2">No hay subastas publicadas todavía.</p>
        </div>

        <!-- Éxito -->
        <div id="grilla-catalogo" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" hidden></div>

        <nav id="paginacion-catalogo" class="mt-4" hidden>
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item"><button class="page-link" id="pagina-anterior" type="button">Anterior</button></li>
                <li class="page-item disabled"><span class="page-link" id="pagina-actual"></span></li>
                <li class="page-item"><button class="page-link" id="pagina-siguiente" type="button">Siguiente</button></li>
            </ul>
        </nav>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/contador.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
